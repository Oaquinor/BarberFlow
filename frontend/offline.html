<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#667eea">
  <title>Sin conexión - KingFlow Barber</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 12px; }
    h1 { margin-bottom: 10px; }
    p { color: #666; line-height: 1.5; }
    .actions { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button, a {
      border: none;
      text-decoration: none;
      cursor: pointer;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
    }
    .primary {
      color: #fff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .secondary {
      color: #333;
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">📴</div>
    <h1>Sin conexión a internet</h1>
    <p>No se pudo conectar con el servidor en este momento. La app seguirá funcionando con contenido almacenado.</p>
    <div class="actions">
      <button class="primary" onclick="window.location.reload()">Reintentar</button>
      <a class="secondary" href="/index.html">Ir al inicio</a>
    </div>
  </main>
</body>
</html>
