<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141412">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
  <title>Crear barbería | KingFlow Barber</title>
  <link rel="stylesheet" href="/css/tailwind.css?v=20261128-2">
</head>
<body class="min-h-dvh bg-stone-100 p-4 font-[Arial,Helvetica,sans-serif] text-stone-900 antialiased sm:p-6 [&_svg]:size-5 [&_svg]:shrink-0 [&_svg]:fill-none [&_svg]:stroke-current [&_a]:underline-offset-4 [&_a:hover]:underline [&_p]:leading-relaxed"><main class="wrap mx-auto w-full max-w-4xl"><section class="card min-w-0 space-y-4 rounded-2xl border border-stone-200 bg-white p-5 sm:p-7">
  <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Abre tu barbería en KingFlow</h1><p id="registrationOffer">El registro crea tu espacio de trabajo y activa el periodo gratuito configurado por la plataforma. Configurarás el negocio en el siguiente paso.</p>
  <p id="registrationStatus" role="status" aria-live="polite"></p>
  <form id="signupForm" autocomplete="on" class="min-w-0 space-y-4">
    <fieldset class="min-w-0 space-y-4 py-5"><legend class="font-semibold">Tu cuenta de propietario</legend><div class="grid min-w-0 grid-cols-1 gap-4 sm:grid-cols-2">
      <div><label for="owner_first_name" class="text-sm font-medium">Nombre</label><input id="owner_first_name" required minlength="2" maxlength="100" autocomplete="given-name" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full"></div>
      <div><label for="owner_last_name" class="text-sm font-medium">Apellido</label><input id="owner_last_name" required minlength="2" maxlength="100" autocomplete="family-name" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full"></div>
      <div><label for="owner_email" class="text-sm font-medium">Correo de acceso</label><input id="owner_email" type="email" required autocomplete="email" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full"></div>
      <div><label for="owner_phone" class="text-sm font-medium">Teléfono</label><input id="owner_phone" type="tel" required minlength="6" maxlength="30" autocomplete="tel" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full"></div>
      <div class="wide sm:col-span-2"><label for="owner_password" class="text-sm font-medium">Contraseña (12 caracteres, una mayúscula y un número)</label><input id="owner_password" type="password" required minlength="12" maxlength="72" autocomplete="new-password" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full"></div>
    </div></fieldset>
    <fieldset class="min-w-0 space-y-4 py-5"><legend class="font-semibold">Datos de la barbería</legend><div class="grid min-w-0 grid-cols-1 gap-4 sm:grid-cols-2">
      <div><label for="barbershop_name" class="text-sm font-medium">Nombre comercial</label><input id="barbershop_name" required minlength="2" maxlength="200" autocomplete="organization" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full"></div>
      <div><label for="barbershop_email" class="text-sm font-medium">Correo del negocio</label><input id="barbershop_email" type="email" required autocomplete="email" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full"></div>
      <div><label for="barbershop_phone" class="text-sm font-medium">Teléfono del negocio</label><input id="barbershop_phone" type="tel" required minlength="6" maxlength="20" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full"></div>
      <div><label for="address_line1" class="text-sm font-medium">Dirección</label><input id="address_line1" required minlength="3" maxlength="255" autocomplete="street-address" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full"></div>
      <div><label for="city" class="text-sm font-medium">Ciudad</label><input id="city" required minlength="2" maxlength="100" autocomplete="address-level2" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full"></div>
      <div><label for="state" class="text-sm font-medium">Provincia / Estado</label><input id="state" required minlength="2" maxlength="100" autocomplete="address-level1" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full"></div>
      <div><label for="postal_code" class="text-sm font-medium">Código postal</label><input id="postal_code" required minlength="2" maxlength="20" autocomplete="postal-code" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full"></div>
      <div><label for="country" class="text-sm font-medium">País</label><input id="country" required minlength="2" maxlength="100" value="República Dominicana" autocomplete="country-name" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full"></div>
      <div><label for="timezone" class="text-sm font-medium">Zona horaria (IANA)</label><input id="timezone" required value="America/Santo_Domingo" placeholder="America/Santo_Domingo" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full"></div>
      <div><label for="currency" class="text-sm font-medium">Moneda</label><select id="currency" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 w-full"><option value="DOP">DOP — Peso dominicano</option><option value="USD">USD — Dólar estadounidense</option><option value="EUR">EUR — Euro</option></select></div>
      <div class="wide sm:col-span-2"><label for="affiliate_code" class="text-sm font-medium">Código de afiliado (opcional)</label><input id="affiliate_code" maxlength="50" autocomplete="off" class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full"></div>
    </div></fieldset>
    <p id="result" role="alert" aria-live="polite"></p><button id="submitButton" type="submit" class="cursor-pointer disabled:cursor-not-allowed disabled:opacity-50 inline-flex min-h-11 items-center justify-center gap-2 rounded-xl border border-amber-800 bg-amber-800 px-4 py-2 text-sm font-semibold text-white hover:bg-amber-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700">Crear cuenta y barbería</button>
  </form>
  <p class="foot py-5 text-center text-sm">¿Ya tienes cuenta? <a href="/">Iniciar sesión</a></p>
</section></main><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/pwa.js"></script><script src="js/signup.js"></script></body></html>
