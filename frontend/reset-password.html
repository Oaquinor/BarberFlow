<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
  <title>Recuperar contraseña | KingFlow Barber</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f4f6;color:#111827;font:16px/1.5 system-ui,sans-serif}.card{width:min(100% - 24px,480px);padding:28px;background:white;border-radius:16px;box-shadow:0 12px 40px #11182714}h1{margin:0 0 8px}p{color:#4b5563}label{display:block;font-weight:600;margin:16px 0 5px}input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;font:inherit}button{width:100%;margin-top:18px;border:0;border-radius:9px;background:#111827;color:white;padding:13px;font:700 1rem system-ui;cursor:pointer}button:disabled{opacity:.6;cursor:wait}[hidden]{display:none!important}#result{min-height:24px}a{color:#1d4ed8}
  </style>
</head>
<body>
  <main class="card">
    <h1>Recupera tu acceso</h1>
    <p>KingFlow enviará un enlace de un solo uso a tu correo. Si tu cuenta existe y está activa, recibirás instrucciones.</p>
    <form id="requestForm">
      <label for="email">Correo de tu cuenta</label>
      <input id="email" type="email" autocomplete="email" maxlength="255" required>
      <button type="submit">Enviar enlace de recuperación</button>
    </form>
    <form id="confirmForm" hidden>
      <label for="newPassword">Nueva contraseña (8 caracteres, una mayúscula y un número)</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
      <button type="submit">Actualizar contraseña</button>
    </form>
    <p id="result" role="status" aria-live="polite"></p>
    <p><a href="/">Volver al inicio de sesión</a></p>
  </main>
  <script src="/js/config.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/password-reset.js"></script>
</body>
</html>
