<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#141412">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
  <title>Recuperar contraseña | KingFlow Barber</title>
  <link rel="stylesheet" href="/css/tailwind.css?v=20261128-2">
</head>
<body class="min-h-dvh bg-stone-100 p-4 font-[Arial,Helvetica,sans-serif] text-stone-900 antialiased sm:p-6 [&_svg]:size-5 [&_svg]:shrink-0 [&_svg]:fill-none [&_svg]:stroke-current [&_a]:underline-offset-4 [&_a:hover]:underline [&_p]:leading-relaxed">
  <main class="card min-w-0 space-y-4 rounded-2xl border border-stone-200 bg-white p-5 sm:p-7">
    <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Recupera tu acceso</h1>
    <p>KingFlow enviará un enlace de un solo uso a tu correo. Si tu cuenta existe y está activa, recibirás instrucciones.</p>
    <form id="requestForm" class="min-w-0 space-y-4">
      <label for="email" class="text-sm font-medium">Correo de tu cuenta</label>
      <input id="email" type="email" autocomplete="email" maxlength="255" required class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full">
      <button type="submit" class="cursor-pointer disabled:cursor-not-allowed disabled:opacity-50 inline-flex min-h-11 items-center justify-center gap-2 rounded-xl border border-amber-800 bg-amber-800 px-4 py-2 text-sm font-semibold text-white hover:bg-amber-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700">Enviar enlace de recuperación</button>
    </form>
    <form id="confirmForm" hidden class="min-w-0 space-y-4">
      <label for="newPassword" class="text-sm font-medium">Nueva contraseña (12 caracteres, una mayúscula y un número)</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required class="min-h-11 max-w-full min-w-0 rounded-lg border border-stone-300 bg-white p-3 text-base text-stone-900 focus-visible:outline-2 focus-visible:outline-amber-700 disabled:opacity-50 w-full">
      <button type="submit" class="cursor-pointer disabled:cursor-not-allowed disabled:opacity-50 inline-flex min-h-11 items-center justify-center gap-2 rounded-xl border border-amber-800 bg-amber-800 px-4 py-2 text-sm font-semibold text-white hover:bg-amber-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700">Actualizar contraseña</button>
    </form>
    <p id="result" role="status" aria-live="polite"></p>
    <p><a href="/">Volver al inicio de sesión</a></p>
  </main>
  <script src="/js/config.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/password-reset.js"></script>
</body>
</html>
