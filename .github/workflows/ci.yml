name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  container-images:
    name: Production container images
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci-only-root-password
      MYSQL_USER: kingflow
      MYSQL_PASSWORD: ci-only-database-password
      MYSQL_DATABASE: kingflow_barber
      DATABASE_URL: mysql+pymysql://kingflow:ci-only-database-password@db:3306/kingflow_barber
      SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
      CORS_ORIGINS: '["https://app.example.com"]'
      FRONTEND_BASE_URL: https://app.example.com
      EMAIL_FROM: ci@kingflow.example
      WHATSAPP_API_TOKEN: ci-only-whatsapp-token
    steps:
      - uses: actions/checkout@v7
      - name: Build API and worker image
        run: docker build -f backend/Dockerfile -t kingflow-api:ci .
      - name: Verify API image defaults to an unprivileged user
        run: test "$(docker image inspect kingflow-api:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Smoke-test API image as its unprivileged user
        run: docker run --rm --entrypoint python kingflow-api:ci -c "from fastapi.testclient import TestClient; from app.main import app; response=TestClient(app).get('/'); assert response.status_code == 200"
      - name: Build WhatsApp image
        run: docker build -t kingflow-whatsapp:ci ./whatsapp-service
      - name: Verify WhatsApp image defaults to an unprivileged user
        run: test "$(docker image inspect kingflow-whatsapp:ci --format '{{.Config.User}}')" = "node"
      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Start production Compose API with MySQL
        run: |
          mkdir -p backend/logs frontend/uploads
          sudo chown -R 10001:10001 backend/logs frontend/uploads
          docker compose -f docker-compose.prod.yml up --build -d db backend
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health | grep -q '"database":"connected"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml logs backend db
          exit 1
      - name: Stop production Compose API
        if: always()
        run: docker compose -f docker-compose.prod.yml down --volumes --remove-orphans

  backend:
    name: Backend (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: kingflow-ci-root
          MYSQL_DATABASE: kingflow_migrations_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
      FRONTEND_BASE_URL: http://localhost:8000
      DATABASE_URL: mysql+pymysql://root:kingflow-ci-root@127.0.0.1:3306/kingflow_migrations_test
      TEST_DATABASE_URL: mysql+pymysql://root:kingflow-ci-root@127.0.0.1:3306/kingflow_barber_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check backend imports and undefined names
        run: python -m flake8 --select=F401,F821,F822,F823 backend/app backend/tests
      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements.txt
      - name: Create isolated integration-test database
        run: |
          python - <<'PY'
          import pymysql

          connection = pymysql.connect(
              host="127.0.0.1",
              user="root",
              password="kingflow-ci-root",
              autocommit=True,
          )
          try:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "CREATE DATABASE kingflow_barber_test "
                      "CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
                  )
          finally:
              connection.close()
          PY
      - name: Verify fresh MySQL migrations
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Verify MySQL migration rollback and recovery
        working-directory: backend
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Run backend unit and MySQL integration tests
        run: python -m pytest backend/tests -q

  javascript:
    name: Frontend and WhatsApp tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            whatsapp-service/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit
      - name: Install Chromium, Firefox and WebKit for browser tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Test browser flows in Chromium
        working-directory: frontend
        run: npx playwright test --browser chromium --reporter=line
      - name: Test browser flows in Firefox
        working-directory: frontend
        run: npx playwright test --browser firefox --reporter=line
      - name: Test browser flows in WebKit
        working-directory: frontend
        run: npx playwright test --browser webkit --reporter=line
      - name: Install WhatsApp dependencies
        working-directory: whatsapp-service
        run: npm ci
      - name: Audit WhatsApp dependencies
        working-directory: whatsapp-service
        run: npm audit
      - name: Test WhatsApp service
        working-directory: whatsapp-service
        run: npm test
