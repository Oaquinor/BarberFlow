[tool.poetry]
name = "kingflow-barber"
version = "1.0.0"
description = "Enterprise SaaS Platform for Modern Barbershops"
authors = ["NOVENTIA GROUP"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.165.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
gunicorn = "^27.0.1"
python-multipart = "^0.0.34"
sqlalchemy = "^2.0.58"
pymysql = ">=1.1,<2"
alembic = "^1.13.1"
pyjwt = "^2.15.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pydantic = {extras = ["email"], version = "^2.14.4"}
pydantic-settings = "^2.16.3"
python-dotenv = "^1.2.4"
tzdata = ">=2024.1,<2028"

[tool.poetry.dev-dependencies]
pytest = "^9.2.0"
pytest-asyncio = "^1.5.0"
httpx = "^0.28.1"
black = "^26.10.1"
isort = "^5.13.2"
flake8 = "^7.5.0"
mypy = "^2.4.1"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
