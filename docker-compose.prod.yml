version: '3.8'

services:
  # MySQL database
  db:
    image: mysql:8.4
    container_name: kingflow_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kingflow_network

  whatsapp:
    build: ./whatsapp-service
    restart: always
    environment:
      WHATSAPP_BIND_HOST: 0.0.0.0
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:?Set WHATSAPP_API_TOKEN}
    volumes:
      - whatsapp_auth:/app/auth_info_baileys
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 10
    networks:
      - kingflow_network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kingflow_backend
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL to the MySQL service}
      - SECRET_KEY=${SECRET_KEY:?Set a strong SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS as a JSON array of HTTPS origins}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:?Set FRONTEND_BASE_URL to the public HTTPS frontend origin}
      - DEBUG=False
      - ENVIRONMENT=production
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@kingflow.com}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN:?Set WHATSAPP_API_TOKEN}
      - WHATSAPP_API_URL=http://whatsapp:3001/send
    ports:
      - "8000:8000"
    volumes:
      - ./backend/logs:/app/logs
      - ./frontend/uploads:/frontend/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - kingflow_network
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  notification-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL to the MySQL service}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@kingflow.com}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN:?Set WHATSAPP_API_TOKEN}
      - WHATSAPP_API_URL=http://whatsapp:3001/send
      - DEBUG=False
      - ENVIRONMENT=production
    depends_on:
      backend:
        condition: service_healthy
      whatsapp:
        condition: service_started
    networks:
      - kingflow_network
    command: python -m scripts.notification_worker

volumes:
  mysql_data:
  whatsapp_auth:

networks:
  kingflow_network:
    driver: bridge
