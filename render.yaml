services:
  # The production database is an externally managed MySQL service.
  - type: web
    name: kingflow-api
    env: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: noreply@kingflow.com
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_API_URL
        sync: false
      - key: DEBUG
        value: False
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
  - type: worker
    name: kingflow-notification-worker
    env: python
    rootDir: backend
    region: oregon
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.notification_worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: noreply@kingflow.com
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_API_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
