services:
  # The production database is an externally managed MySQL service.
  - type: web
    name: kingflow-api
    env: python
    region: oregon
    plan: 0.5c-512mb
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '[]'
      - key: FRONTEND_BASE_URL
        fromService:
          name: kingflow-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_API_URL
        sync: false
      - key: UPLOAD_DIR
        value: /opt/render/project/src/frontend/uploads
      - key: DEBUG
        value: False
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
    disk:
      name: kingflow-uploads
      mountPath: /opt/render/project/src/frontend/uploads
      sizeGB: 1
  - type: worker
    name: kingflow-notification-worker
    env: python
    rootDir: backend
    region: oregon
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.notification_worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_API_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
