services:
  # PostgreSQL Database
  - type: pserv
    name: kingflow-db
    env: python
    plan: free
    region: oregon
    databases:
      - name: kingflow_barber
        user: kingflow
        plan: free

  # FastAPI Backend
  - type: web
    name: kingflow-api
    env: python
    region: oregon
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kingflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
